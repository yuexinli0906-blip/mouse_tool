[package]
name = "yugutou_tool"
version = "3.4.0"
description = "A Tauri App"
authors = [ "yugutou" ]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = [
  "staticlib",
  "cdylib",
  "rlib"
]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [ "tray-icon" ] }
tauri-plugin-opener = "2"
serde = { version = "1", features = [ "derive" ] }
serde_json = "1"
hidapi = "2"
tauri-plugin-zustand = "1"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Specta v2 + tauri-specta for Tauri 2. Pin the release candidates together.
# crates.io latest matched set (docs mention rc.27, which is not published yet).
specta = { version = "=2.0.0-rc.26", features = [ "derive", "function" ] }
specta-typescript = "0.0.13"
tauri-specta = { version = "=2.0.0-rc.26", features = [ "derive", "typescript" ] }

[target.'cfg(windows)'.dependencies]
windows-registry = "0.6"
windows-result = "0.4"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
