name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.12.2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Sync version from tag
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VER="${GITHUB_REF_NAME#v}"
            node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.version=process.argv[1];fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')" "$VER"
            node scripts/sync-version.mjs
            echo "Synced app version to $VER from tag"
          else
            node scripts/sync-version.mjs
          fi

      - name: Load release notes
        id: notes
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#v}"
          FILE="docs/releases/v${VER}.md"
          if [[ ! -f "$FILE" ]]; then
            PREV=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
            if [[ -n "$PREV" ]]; then
              node scripts/gen-release-notes.mjs --from "$PREV" --to "$GITHUB_REF_NAME" --write "$FILE"
            else
              node scripts/gen-release-notes.mjs --to "$GITHUB_REF_NAME" --write "$FILE"
            fi
          fi
          {
            echo 'body<<EOF'
            cat "$FILE"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build and release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: yugutou_tool v__VERSION__
          releaseBody: ${{ steps.notes.outputs.body }}
          generateReleaseNotes: false
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: false
